
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Halaman Ujian - Portal Sekolah</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 15px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        h2 {
            margin-top: 0;
            color: #1e293b;
        }

        p {
            color: #475569;
            line-height: 1.5;
        }

        .container {
            width: 100%;
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }

        iframe {
            display: block;
            width: 100%;
            height: 80vh;
            min-height: 450px;
            border: none;
        }

        @media (max-width: 600px) {
            body {
                padding: 8px;
            }

            iframe {
                height: 78vh;
                min-height: 400px;
            }
        }
    </style>
</head>

<body>

    <h2>Halaman Ujian</h2>

    <p>
        Silakan mengerjakan soal dengan teliti.
        Jangan meninggalkan halaman ujian.
    </p>

    <div class="container">
        <iframe
            id="iframeUjian"
            title="Formulir Ujian"
            src="https://docs.google.com/forms/d/e/1FAIpQLScMgSUSrQkh3Eck1oNI93NkhnjtF6eQrw-VeJZcMcwWcKYH_w/viewform?usp=sharing&ouid=110367447242542532252">
        </iframe>
    </div>

    <script>
    "use strict";

    // ========================================
    // PENGATURAN
    // ========================================

    const HALAMAN_STOP = "stop.html";
    const TUNDA_BLUR = 700;

    let sedangProses = false;
    let timerBlur = null;
    let waktuResize = 0;

    // ========================================
    // DETEKSI RESIZE / KEYBOARD HP
    // ========================================

    if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", function () {
            waktuResize = Date.now();
        });
    }

    window.addEventListener("resize", function () {
        waktuResize = Date.now();
    });

    // ========================================
    // FUNGSI AKHIRI UJIAN
    // ========================================

    function akhiriUjian(alasan) {

        if (sedangProses) {
            return;
        }

        sedangProses = true;

        console.warn("Ujian dihentikan:", alasan);

        // Arahkan ke halaman penghentian ujian
        window.location.replace(HALAMAN_STOP);
    }

    // ========================================
    // DETEKSI HALAMAN MASUK LATAR BELAKANG
    // ========================================

    document.addEventListener("visibilitychange", function () {

        if (document.visibilityState === "hidden") {

            // Halaman benar-benar dilaporkan tersembunyi
            // oleh browser.
            akhiriUjian("Halaman masuk ke latar belakang");

        }
    });

    // ========================================
    // DETEKSI BLUR SEBAGAI PEMERIKSAAN TAMBAHAN
    // ========================================

    window.addEventListener("blur", function () {

        if (sedangProses) {
            return;
        }

        if (timerBlur !== null) {
            clearTimeout(timerBlur);
        }

        timerBlur = setTimeout(function () {

            timerBlur = null;

            if (sedangProses) {
                return;
            }

            // Jangan akhiri hanya karena blur.
            // Tunggu status halaman dari browser.
            if (document.visibilityState === "hidden") {
                akhiriUjian("Blur disertai halaman tersembunyi");
            }

        }, TUNDA_BLUR);

    });

    // ========================================
    // BATALKAN PEMERIKSAAN JIKA KEMBALI FOKUS
    // ========================================

    window.addEventListener("focus", function () {

        if (timerBlur !== null) {
            clearTimeout(timerBlur);
            timerBlur = null;
        }

    });

    // ========================================
    // PEMERIKSAAN SAAT HALAMAN KEMBALI TERLIHAT
    // ========================================

    document.addEventListener("visibilitychange", function () {

        if (document.visibilityState === "visible") {
            console.log("Halaman ujian terlihat kembali.");
        }

    });

    </script>

</body>
</html>
