<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Ujian</title>
</head>
<body>

    <h2>Halaman Ujian</h2>
    <p>Jangan meninggalkan halaman ujian.</p>
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLScMgSUSrQkh3Eck1oNI93NkhnjtF6eQrw-VeJZcMcwWcKYH_w/viewform?usp=sharing&ouid=110367447242542532252" frameborder="0" style="width:100%; height:500px;"></iframe>

    <script>
        // Deteksi perangkat (Mobile / HP vs Laptop / PC)
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || navigator.maxTouchPoints > 0;

        let baseHeight = window.innerHeight;

        // 1. Deteksi perpindahan tab (Berlaku untuk Laptop & HP)
        document.addEventListener("visibilitychange", function () {
            if (document.hidden) {
                window.location.replace("stop.html");
            }
        });

        if (!isMobile) {
            // === ATURAN LAPTOP / PC ===
            // Resize dan blur langsung mengakhiri ujian
            window.addEventListener("blur", function () {
                window.location.replace("stop.html");
            });
            window.addEventListener("resize", function () {
                window.location.replace("stop.html");
            });
        } else {
            // === ATURAN HP / MOBILE ===
            
            // Perubahan ukuran (resize) saja TIDAK mengakhiri ujian
            window.addEventListener("resize", function () {
                // Perbarui baseHeight jika tinggi bertambah/stabil (keyboard tertutup)
                if (window.innerHeight > baseHeight) {
                    baseHeight = window.innerHeight;
                }
            });

            let blurTimeout = null;

            // Ketika terjadi blur pada HP
            window.addEventListener("blur", function () {
                // Menunggu 800 milidetik untuk memeriksa perubahan tinggi viewport
                blurTimeout = setTimeout(function () {
                    let currentHeight = window.innerHeight;
                    let heightDiff = baseHeight - currentHeight;

                    // Jika tinggi viewport turun lebih dari 120 piksel, 
                    // anggap keyboard virtual sedang aktif dan abaikan blur tersebut
                    if (heightDiff > 120) {
                        return; 
                    }

                    // Jika bukan karena keyboard (misal pindah aplikasi), akhiri ujian
                    window.location.replace("stop.html");
                }, 800);
            });

            // Jika fokus kembali sebelum 800ms (misal kedipan/notifikasi cepat), batalkan timeout
            window.addEventListener("focus", function () {
                if (blurTimeout) {
                    clearTimeout(blurTimeout);
                    blurTimeout = null;
                }
            });
        }
    </script>

</body>
</html>
