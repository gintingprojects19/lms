<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Ujian</title>
</head>
<body>

    <h2>Halaman Ujian</h2>
    <p>Jangan meninggalkan halaman ujian.</p>
    <iframe id="exam-frame" src="https://docs.google.com/forms/d/e/1FAIpQLScMgSUSrQkh3Eck1oNI93NkhnjtF6eQrw-VeJZcMcwWcKYH_w/viewform?usp=sharing&ouid=110367447242542532252" frameborder="0" style="width:100%; height:500px;"></iframe>

    <script>
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || navigator.maxTouchPoints > 0;
        let baseHeight = window.innerHeight;
        let isKeyboardActive = false;

        function endExam() {
            window.location.replace("stop.html");
        }

        // 1. Deteksi utama untuk perpindahan tab / minimize / tombol tengah (Recent Apps)
        document.addEventListener("visibilitychange", function () {
            if (document.hidden || document.visibilityState === "hidden") {
                endExam();
            }
        });

        if (isMobile) {
            window.addEventListener("pagehide", endExam);
            window.addEventListener("freeze", endExam);

            // Pantau perubahan ukuran layar (Keyboard HP)
            window.addEventListener("resize", function () {
                let currentHeight = window.innerHeight;
                let heightDiff = baseHeight - currentHeight;

                // Jika tinggi turun > 120px, tandai bahwa keyboard sedang aktif
                if (heightDiff > 120) {
                    isKeyboardActive = true;
                } else if (currentHeight >= baseHeight) {
                    isKeyboardActive = false;
                    baseHeight = currentHeight;
                }
            });

            // 2. Deteksi Blur pada HP
            window.addEventListener("blur", function () {
                // Jika kursor/fokus sedang di dalam Google Form (iframe), abaikan
                if (document.activeElement === document.getElementById("exam-frame")) {
                    return;
                }

                // Beri jeda singkat untuk memastikan status keyboard
                setTimeout(function () {
                    // Jika keyboard sedang aktif, abaikan blur
                    if (isKeyboardActive) {
                        return;
                    }

                    // Jika layar blur tapi bukan karena keyboard (berarti tombol tengah / recent apps), akhiri ujian
                    endExam();
                }, 200);
            });

            window.addEventListener("focus", function () {
                // Reset status keyboard saat fokus kembali
                setTimeout(() => {
                    if (window.innerHeight > baseHeight) {
                        baseHeight = window.innerHeight;
                    }
                    isKeyboardActive = false;
                }, 300);
            });

        } else {
            // === ATURAN LAPTOP / PC ===
            window.addEventListener("blur", function () {
                setTimeout(function () {
                    if (document.activeElement === document.getElementById("exam-frame")) {
                        return;
                    }
                    endExam();
                }, 200);
            });

            window.addEventListener("resize", endExam);
        }
    </script>

</body>
</html>
