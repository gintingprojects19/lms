<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Ujian</title>
</head>
<body>

    <h2>Halaman Ujian</h2>
    <p>Jangan meninggalkan halaman ujian.</p>
    <iframe id="exam-frame" src="https://docs.google.com/forms/d/e/1FAIpQLScMgSUSrQkh3Eck1oNI93NkhnjtF6eQrw-VeJZcMcwWcKYH_w/viewform?usp=sharing&ouid=110367447242542532252" frameborder="0" style="width:100%; height:500px;"></iframe>

    <script>
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || navigator.maxTouchPoints > 0;
        let baseHeight = window.innerHeight;
        let isTyping = false;

        function endExam() {
            window.location.replace("stop.html");
        }

        // 1. Deteksi standar visibilitas (pindah tab / minimize)
        document.addEventListener("visibilitychange", function () {
            if (document.hidden || document.visibilityState === "hidden") {
                endExam();
            }
        });

        if (isMobile) {
            window.addEventListener("pagehide", endExam);
            window.addEventListener("freeze", endExam);

            // Pantau perubahan tinggi layar untuk mendeteksi keyboard virtual
            window.addEventListener("resize", function () {
                let currentHeight = window.innerHeight;
                let heightDiff = baseHeight - currentHeight;

                // Jika tinggi turun drastis (> 120px), berarti KEYBOARD HP yang muncul
                if (heightDiff > 120) {
                    isTyping = true;
                } else {
                    isTyping = false;
                    if (currentHeight > baseHeight) {
                        baseHeight = currentHeight;
                    }
                }
            });

            // 2. Deteksi Blur Khusus HP
            window.addEventListener("blur", function () {
                // Beri jeda singkat untuk memastikan kondisi
                setTimeout(function () {
                    // Jika siswa sedang mengetik (keyboard aktif), abaikan blur
                    if (isTyping) {
                        return;
                    }

                    // Jika fokus di dalam Google Form (iframe) DAN tinggi layar tidak berubah (artinya tidak ada keyboard),
                    // tapi layar blur karena tombol tengah ditahan -> AKHIRI UJIAN
                    let currentHeight = window.innerHeight;
                    let heightDiff = baseHeight - currentHeight;

                    // Jika tinggi tidak turun banyak (< 120px), ini FIX adalah menu tahan tombol tengah (Google Assistant/Search)
                    if (heightDiff <= 120) {
                        endExam();
                    }
                }, 250);
            });

            window.addEventListener("focus", function () {
                setTimeout(() => {
                    if (window.innerHeight > baseHeight) {
                        baseHeight = window.innerHeight;
                    }
                    isTyping = false;
                }, 300);
            });

        } else {
            // === ATURAN LAPTOP / PC ===
            window.addEventListener("blur", function () {
                setTimeout(function () {
                    if (document.activeElement === document.getElementById("exam-frame")) {
                        return;
                    }
                    endExam();
                }, 200);
            });

            window.addEventListener("resize", endExam);
        }
    </script>

</body>
</html>
