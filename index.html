
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ujian - Portal Sekolah</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 12px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        h2 {
            color: #1e293b;
        }

        .keterangan {
            padding: 12px;
            margin-bottom: 12px;
            background: #fff;
            border-radius: 8px;
        }

        .form-container {
            width: 100%;
            overflow: hidden;
            background: white;
            border-radius: 8px;
        }

        iframe {
            display: block;
            width: 100%;
            height: 80vh;
            min-height: 450px;
            border: 0;
        }

        @media (max-width: 600px) {
            body {
                padding: 6px;
            }

            iframe {
                height: 78vh;
                min-height: 400px;
            }
        }
    </style>
</head>

<body>

    <h2>Halaman Ujian</h2>

    <div class="keterangan">
        Silakan mengerjakan soal dengan teliti.
        Jangan meninggalkan halaman ujian.
    </div>

    <div class="form-container">
        <iframe
            id="iframeUjian"
            title="Formulir Ujian"
            src="https://docs.google.com/forms/d/e/1FAIpQLScMgSUSrQkh3Eck1oNI93NkhnjtF6eQrw-VeJZcMcwWcKYH_w/viewform?usp=sharing&ouid=110367447242542532252">
        </iframe>
    </div>

<script>
"use strict";

// ==========================================
// PENGATURAN
// ==========================================

const HALAMAN_STOP = "stop.html";
const BATAS_KEYBOARD = 120;
const TUNDA_PEMERIKSAAN = 1000;

let sedangProses = false;
let timerBlur = null;
let timerResize = null;

let waktuResize = 0;
let tinggiAwal = window.visualViewport
    ? window.visualViewport.height
    : window.innerHeight;

// ==========================================
// FUNGSI MENGAKHIRI UJIAN
// ==========================================

function akhiriUjian(alasan) {
    if (sedangProses) {
        return;
    }

    sedangProses = true;

    console.warn("Ujian dihentikan:", alasan);

    window.location.replace(HALAMAN_STOP);
}

// ==========================================
// DETEKSI KEMUNGKINAN KEYBOARD VIRTUAL
// ==========================================

function keyboardTerlihat() {
    if (!window.visualViewport) {
        return false;
    }

    const tinggiSekarang = window.visualViewport.height;

    return (tinggiAwal - tinggiSekarang) > BATAS_KEYBOARD;
}

// ==========================================
// DETEKSI RESIZE
// ==========================================

function periksaResize() {
    waktuResize = Date.now();

    if (timerResize !== null) {
        clearTimeout(timerResize);
    }

    timerResize = setTimeout(function () {
        timerResize = null;

        // Jangan menghentikan ujian hanya karena resize.
        // Resize juga dapat disebabkan oleh keyboard,
        // orientasi layar, atau perubahan browser.
        if (keyboardTerlihat()) {
            return;
        }

        // Perubahan ukuran saja bukan bukti siswa
        // meninggalkan ujian atau membuka AI.
    }, TUNDA_PEMERIKSAAN);
}

window.addEventListener("resize", periksaResize);

if (window.visualViewport) {
    window.visualViewport.addEventListener(
        "resize",
        periksaResize
    );
}

// ==========================================
// DETEKSI BLUR
// ==========================================

window.addEventListener("blur", function () {
    if (sedangProses) {
        return;
    }

    if (timerBlur !== null) {
        clearTimeout(timerBlur);
    }

    timerBlur = setTimeout(function () {
        timerBlur = null;

        if (sedangProses) {
            return;
        }

        // Jangan langsung mengakhiri ujian karena blur.
        // Periksa apakah browser melaporkan halaman hidden.
        if (document.visibilityState === "hidden") {
            akhiriUjian("Halaman kehilangan visibilitas");
        }

    }, TUNDA_PEMERIKSAAN);
});

// ==========================================
// DETEKSI HALAMAN MASUK LATAR BELAKANG
// ==========================================

document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") {
        akhiriUjian("Halaman masuk ke latar belakang");
    }
});

// ==========================================
// DETEKSI SAAT HALAMAN KEMBALI FOKUS
// ==========================================

window.addEventListener("focus", function () {
    if (timerBlur !== null) {
        clearTimeout(timerBlur);
        timerBlur = null;
    }
});

// ==========================================
// DETEKSI HALAMAN DIBUKA KEMBALI
// ==========================================

window.addEventListener("pageshow", function () {
    if (document.visibilityState === "hidden") {
        akhiriUjian("Halaman dibuka dalam kondisi tersembunyi");
    }
});

</script>

</body>
</html>
