<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Ujian</title>
</head>
<body>

    <h2>Halaman Ujian</h2>
    <p>Jangan meninggalkan halaman ujian.</p>
    <iframe id="exam-frame" src="https://docs.google.com/forms/d/e/1FAIpQLScMgSUSrQkh3Eck1oNI93NkhnjtF6eQrw-VeJZcMcwWcKYH_w/viewform?usp=sharing&ouid=110367447242542532252" frameborder="0" style="width:100%; height:500px;"></iframe>

    <script>
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || navigator.maxTouchPoints > 0;
        let baseHeight = window.innerHeight;

        // Fungsi universal untuk mengakhiri ujian
        function endExam() {
            window.location.replace("stop.html");
        }

        // 1. Deteksi visibilitas standar (Tab ditukar / minimize)
        document.addEventListener("visibilitychange", function () {
            if (document.hidden || document.visibilityState === "hidden") {
                endExam();
            }
        });

        // 2. Deteksi khusus HP saat aplikasi dibekukan atau disembunyikan (Tombol Home / Recent Apps)
        if (isMobile) {
            window.addEventListener("pagehide", function () {
                endExam();
            });
            window.addEventListener("freeze", function () {
                endExam();
            });
        }

        if (!isMobile) {
            // === ATURAN LAPTOP / PC ===
            window.addEventListener("blur", function () {
                setTimeout(function () {
                    if (document.activeElement === document.getElementById("exam-frame")) {
                        return;
                    }
                    endExam();
                }, 200);
            });

            window.addEventListener("resize", function () {
                endExam();
            });
        } else {
            // === ATURAN HP / MOBILE ===
            window.addEventListener("resize", function () {
                if (window.innerHeight > baseHeight) {
                    baseHeight = window.innerHeight;
                }
            });

            let blurTimer = null;

            window.addEventListener("blur", function () {
                // Jika fokus lari ke iframe (sedang mengetik di Google Form), abaikan
                if (document.activeElement === document.getElementById("exam-frame")) {
                    return;
                }

                // Berikan jeda untuk mendeteksi apakah ini karena keyboard virtual atau tombol tengah (Recent Apps)
                blurTimer = setTimeout(function () {
                    let currentHeight = window.innerHeight;
                    let heightDiff = baseHeight - currentHeight;

                    // Jika tinggi turun drastis (> 120px), itu adalah KEYBOARD VIRTUAL, jadi abaikan
                    if (heightDiff > 120) {
                        return;
                    }

                    // Jika tinggi tidak berubah signifikan tapi layar blur (karena tombol tengah / Recent Apps ditekan), akhiri ujian
                    endExam();
                }, 350);
            });

            // Jika pengguna kembali fokus ke halaman sebelum timer selesai (bukan pelanggaran berat)
            window.addEventListener("focus", function () {
                if (blurTimer) {
                    clearTimeout(blurTimer);
                    blurTimer = null;
                }
            });
        }
    </script>

</body>
</html>
