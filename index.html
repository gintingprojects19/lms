<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Ujian</title>
</head>
<body>

    <h2>Halaman Ujian</h2>
    <p>Jangan meninggalkan halaman ujian.</p>
  
    <form action="">
        <input type="text" placeholder="isi text">
        <button>kirim</button>
    </form>

    
    <script>

let tinggiAwal = window.visualViewport
    ? window.visualViewport.height
    : window.innerHeight;

let keyboardAktif = false;
let sedangProses = false;
let waktuResize = 0;

// Deteksi kemungkinan keyboard virtual HP
if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", function () {
        let tinggiSekarang = window.visualViewport.height;

        if (tinggiAwal - tinggiSekarang > 120) {
            keyboardAktif = true;
        } else {
            keyboardAktif = false;
        }

        waktuResize = Date.now();
    });
}

// Fungsi blur tetap digunakan
window.addEventListener("blur", function () {

    // Jika sedang proses pengalihan, hentikan pemeriksaan
    if (sedangProses) {
        return;
    }

    // Abaikan blur jika keyboard terdeteksi
    if (keyboardAktif) {
        return;
    }

    // Abaikan blur yang berdekatan dengan perubahan viewport
    if (Date.now() - waktuResize < 1000) {
        return;
    }

    // Akhiri ujian
    sedangProses = true;
    window.location.replace("stop.html");

});

// Periksa kembali kondisi keyboard ketika halaman fokus
window.addEventListener("focus", function () {

    if (window.visualViewport) {
        keyboardAktif =
            tinggiAwal - window.visualViewport.height > 120;
    }

});

    </script>

</body>
</html>
