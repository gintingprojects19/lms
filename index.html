<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Ujian</title>
</head>
<body>

    <h2>Halaman Ujian</h2>
    <p>Jangan meninggalkan halaman ujian.</p>
    <iframe id="exam-frame" src="https://docs.google.com/forms/d/e/1FAIpQLScMgSUSrQkh3Eck1oNI93NkhnjtF6eQrw-VeJZcMcwWcKYH_w/viewform?usp=sharing&ouid=110367447242542532252" frameborder="0" style="width:100%; height:500px;"></iframe>

    <script>
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || navigator.maxTouchPoints > 0;
        let baseHeight = window.innerHeight;

        function endExam() {
            window.location.replace("stop.html");
        }

        // 1. Deteksi visibilitas standar (pindah tab / minimize)
        document.addEventListener("visibilitychange", function () {
            if (document.hidden || document.visibilityState === "hidden") {
                endExam();
            }
        });

        if (isMobile) {
            window.addEventListener("pagehide", endExam);
            window.addEventListener("freeze", endExam);

            // Perbarui baseHeight saat ukuran berubah (misal orientasi atau keyboard ditutup)
            window.addEventListener("resize", function () {
                if (window.innerHeight > baseHeight) {
                    baseHeight = window.innerHeight;
                }
            });

            // 2. PEMANTAUAN BERKALA (POLLING) KHUSUS HP
            setInterval(function () {
                // Jika halaman disembunyikan total
                if (document.hidden || document.visibilityState === "hidden") {
                    endExam();
                    return;
                }

                // Cek jika halaman kehilangan fokus (termasuk saat layar blur karena tombol tengah ditahan)
                if (!document.hasFocus()) {
                    // Abaikan jika fokus sedang berada di dalam Google Form (iframe) untuk mengetik
                    if (document.activeElement === document.getElementById("exam-frame")) {
                        return;
                    }

                    // Cek perubahan tinggi layar untuk mendeteksi keyboard virtual HP
                    let currentHeight = window.innerHeight;
                    let heightDiff = baseHeight - currentHeight;

                    // KUNCI UTAMA: Jika tinggi turun lebih dari 120 piksel, 
                    // itu BERARTI KEYBOARD VIRTUAL yang muncul -> ABAIKAN BLUR
                    if (heightDiff > 120) {
                        return;
                    }

                    // Jika tinggi TIDAK turun drastis (artinya layar blur karena tombol tengah / recent apps), 
                    // maka UJIAN BERAKHIR
                    endExam();
                }
            }, 300);

        } else {
            // === ATURAN LAPTOP / PC ===
            window.addEventListener("blur", function () {
                setTimeout(function () {
                    if (document.activeElement === document.getElementById("exam-frame")) {
                        return;
                    }
                    endExam();
                }, 200);
            });

            window.addEventListener("resize", endExam);
        }
    </script>

</body>
</html>
