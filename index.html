<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Ujian</title>
</head>
<body>

    <h2>Halaman Ujian</h2>
    <p>Jangan meninggalkan halaman ujian.</p>
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLScMgSUSrQkh3Eck1oNI93NkhnjtF6eQrw-VeJZcMcwWcKYH_w/viewform?usp=sharing&ouid=110367447242542532252" frameborder="0" style="width:100%; height:500px;"></iframe>

    <script>
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || navigator.maxTouchPoints > 0;

        let baseHeight = window.innerHeight;

        // 1. Deteksi utama: Jika halaman disembunyikan (termasuk saat tombol tengah ditekan lama / Recent Apps)
        document.addEventListener("visibilitychange", function () {
            if (document.hidden || document.visibilityState === "hidden") {
                window.location.replace("stop.html");
            }
        });

        if (!isMobile) {
            // === ATURAN LAPTOP / PC ===
            window.addEventListener("blur", function () {
                window.location.replace("stop.html");
            });
            window.addEventListener("resize", function () {
                window.location.replace("stop.html");
            });
        } else {
            // === ATURAN HP / MOBILE ===
            window.addEventListener("resize", function () {
                if (window.innerHeight > baseHeight) {
                    baseHeight = window.innerHeight;
                }
            });

            // Ketika layar menjadi blur (termasuk saat tombol tengah ditekan lama / multitasking)
            window.addEventListener("blur", function () {
                // Berikan sedikit jeda untuk memastikan apakah ini karena keyboard virtual atau buka menu lain
                setTimeout(function () {
                    let currentHeight = window.innerHeight;
                    let heightDiff = baseHeight - currentHeight;

                    // Jika tinggi viewport turun drastis (> 120px), itu berarti KEYBOARD VIRTUAL yang muncul, abaikan.
                    if (heightDiff > 120) {
                        return; 
                    }

                    // Jika tinggi tidak berubah signifikan (berarti layar blur karena tombol tengah / pindah aplikasi), akhiri ujian.
                    window.location.replace("stop.html");
                }, 200);
            });
        }
    </script>

</body>
</html>
