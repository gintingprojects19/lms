
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Halaman Ujian - Portal Sekolah</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 12px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        h2 {
            color: #1e293b;
            margin-top: 0;
        }

        p {
            color: #475569;
            line-height: 1.5;
        }

        .form-container {
            width: 100%;
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }

        iframe {
            display: block;
            width: 100%;
            height: 80vh;
            min-height: 400px;
            border: none;
        }

        @media (max-width: 600px) {
            body {
                padding: 6px;
            }

            iframe {
                height: 78vh;
                min-height: 400px;
            }
        }
    </style>
</head>

<body>

    <h2>Halaman Ujian</h2>

    <p>
        Silakan mengerjakan soal dengan teliti.
        Jangan meninggalkan halaman ujian.
    </p>

    <div class="form-container">

        <iframe
            id="iframeUjian"
            title="Google Forms Ujian"
            src="https://docs.google.com/forms/d/e/1FAIpQLScMgSUSrQkh3Eck1oNI93NkhnjtF6eQrw-VeJZcMcwWcKYH_w/viewform?usp=sharing&ouid=110367447242542532252">
        </iframe>

    </div>

<script>
"use strict";

// =============================================
// 1. PENGATURAN
// =============================================

const HALAMAN_STOP = "stop.html";

const BATAS_KEYBOARD = 120;
const WAKTU_INISIALISASI = 2000;
const TUNDA_BLUR = 1000;
const TUNDA_RESIZE = 700;

let sedangProses = false;
let siapMendeteksi = false;
let keyboardAktif = false;

let timerBlur = null;
let timerResize = null;

let tinggiAwal = tinggiViewport();

// =============================================
// 2. MENGAMBIL TINGGI VIEWPORT
// =============================================

function tinggiViewport() {
    return window.visualViewport
        ? window.visualViewport.height
        : window.innerHeight;
}

// =============================================
// 3. INISIALISASI HALAMAN
// =============================================

// Beri waktu untuk proses awal halaman dan iframe.
// Resize selama tahap ini tidak digunakan untuk
// mengakhiri ujian.

setTimeout(function () {

    tinggiAwal = tinggiViewport();
    keyboardAktif = false;
    siapMendeteksi = true;

    console.log("Deteksi ujian aktif.");

}, WAKTU_INISIALISASI);

// =============================================
// 4. DETEKSI KEYBOARD VIRTUAL
// =============================================

function periksaKeyboard() {

    const tinggiSekarang = tinggiViewport();

    const selisih = tinggiAwal - tinggiSekarang;

    keyboardAktif = selisih > BATAS_KEYBOARD;

    return keyboardAktif;
}

// =============================================
// 5. FUNGSI MENGAKHIRI UJIAN
// =============================================

function akhiriUjian(alasan) {

    if (sedangProses) {
        return;
    }

    sedangProses = true;

    console.warn("Ujian dihentikan:", alasan);

    window.location.replace(HALAMAN_STOP);
}

// =============================================
// 6. DETEKSI RESIZE
// =============================================

function tanganiResize() {

    if (!siapMendeteksi || sedangProses) {
        return;
    }

    periksaKeyboard();

    // Abaikan perubahan ukuran yang kemungkinan
    // disebabkan keyboard virtual.
    if (keyboardAktif) {

        clearTimeout(timerResize);
        timerResize = null;

        return;
    }

    clearTimeout(timerResize);

    timerResize = setTimeout(function () {

        timerResize = null;

        if (!siapMendeteksi || sedangProses) {
            return;
        }

        periksaKeyboard();

        if (keyboardAktif) {
            return;
        }

        // Resize saja tidak cukup untuk memastikan
        // siswa meninggalkan ujian.
        // Pengakhiran dilakukan melalui pemeriksaan blur.

    }, TUNDA_RESIZE);
}

window.addEventListener("resize", tanganiResize);

if (window.visualViewport) {

    window.visualViewport.addEventListener(
        "resize",
        tanganiResize
    );

}

// =============================================
// 7. DETEKSI BLUR
// =============================================

window.addEventListener("blur", function () {

    if (!siapMendeteksi || sedangProses) {
        return;
    }

    periksaKeyboard();

    // Jangan akhiri ujian saat keyboard aktif.
    if (keyboardAktif) {
        return;
    }

    clearTimeout(timerBlur);

    timerBlur = setTimeout(function () {

        timerBlur = null;

        if (!siapMendeteksi || sedangProses) {
            return;
        }

        periksaKeyboard();

        // Periksa lagi setelah jeda karena keyboard
        // mungkin baru muncul setelah event blur.
        if (keyboardAktif) {
            return;
        }

        // Jika window sudah kembali fokus, abaikan.
        if (document.hasFocus()) {
            return;
        }

        // Blur tetap berlangsung tanpa indikasi keyboard.
        akhiriUjian("Halaman kehilangan fokus");

    }, TUNDA_BLUR);

});

// =============================================
// 8. DETEKSI FOCUS
// =============================================

window.addEventListener("focus", function () {

    clearTimeout(timerBlur);
    timerBlur = null;

    if (!siapMendeteksi || sedangProses) {
        return;
    }

    periksaKeyboard();

    // Perbarui tinggi dasar jika viewport sudah kembali
    // mendekati ukuran sebelum keyboard muncul.
    if (
        Math.abs(tinggiAwal - tinggiViewport()) <=
        BATAS_KEYBOARD
    ) {

        tinggiAwal = tinggiViewport();
        keyboardAktif = false;

    }

});

// =============================================
// 9. PERUBAHAN ORIENTASI LAYAR
// =============================================

window.addEventListener("orientationchange", function () {

    clearTimeout(timerBlur);
    clearTimeout(timerResize);

    setTimeout(function () {

        if (sedangProses) {
            return;
        }

        tinggiAwal = tinggiViewport();
        keyboardAktif = false;

    }, 700);

});

</script>

</body>
</html>
