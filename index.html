<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Halaman Ujian</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 12px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        h2 {
            color: #1e293b;
        }

        iframe {
            display: block;
            width: 100%;
            height: 80vh;
            min-height: 400px;
            border: none;
            background: white;
        }
    </style>
</head>

<body>

    <h2>Halaman Ujian</h2>
    <p>Silakan mengerjakan soal dengan teliti.</p>

    <iframe
        id="iframeUjian"
        title="Google Forms Ujian"
        src="https://docs.google.com/forms/d/e/1FAIpQLScMgSUSrQkh3Eck1oNI93NkhnjtF6eQrw-VeJZcMcwWcKYH_w/viewform?usp=sharing&ouid=110367447242542532252">
    </iframe>

<script>
"use strict";

// =======================================
// PENGATURAN
// =======================================

const HALAMAN_STOP = "stop.html";
const BATAS_KEYBOARD = 120;
const TUNDA_BLUR = 1000;
const TUNDA_RESIZE = 700;

let sedangProses = false;
let keyboardAktif = false;

let timerBlur = null;
let timerResize = null;

let tinggiAwal = window.visualViewport
    ? window.visualViewport.height
    : window.innerHeight;

// =======================================
// FUNGSI TINGGI VIEWPORT
// =======================================

function tinggiSekarang() {
    return window.visualViewport
        ? window.visualViewport.height
        : window.innerHeight;
}

// =======================================
// DETEKSI KEYBOARD VIRTUAL
// =======================================

function periksaKeyboard() {
    const selisih = tinggiAwal - tinggiSekarang();

    keyboardAktif = selisih > BATAS_KEYBOARD;

    return keyboardAktif;
}

// =======================================
// AKHIRI UJIAN
// =======================================

function akhiriUjian(alasan) {
    if (sedangProses) {
        return;
    }

    sedangProses = true;

    console.warn("Ujian diakhiri:", alasan);

    window.location.replace(HALAMAN_STOP);
}

// =======================================
// RESIZE VIEWPORT
// =======================================

function tanganiResize() {
    if (sedangProses) {
        return;
    }

    periksaKeyboard();

    // Jika keyboard aktif, jangan akhiri ujian.
    if (keyboardAktif) {
        if (timerResize !== null) {
            clearTimeout(timerResize);
            timerResize = null;
        }
        return;
    }

    if (timerResize !== null) {
        clearTimeout(timerResize);
    }

    timerResize = setTimeout(function () {
        timerResize = null;

        periksaKeyboard();

        // Abaikan resize jika ternyata keyboard aktif.
        if (keyboardAktif || sedangProses) {
            return;
        }

        // Resize yang tidak dikenali sebagai keyboard
        // akan mengakhiri ujian.
        akhiriUjian("Resize di luar kondisi keyboard");

    }, TUNDA_RESIZE);
}

window.addEventListener("resize", tanganiResize);

if (window.visualViewport) {
    window.visualViewport.addEventListener(
        "resize",
        tanganiResize
    );
}

// =======================================
// BLUR WINDOW
// =======================================

window.addEventListener("blur", function () {
    if (sedangProses) {
        return;
    }

    periksaKeyboard();

    // Keyboard aktif: abaikan blur.
    if (keyboardAktif) {
        return;
    }

    if (timerBlur !== null) {
        clearTimeout(timerBlur);
    }

    timerBlur = setTimeout(function () {
        timerBlur = null;

        if (sedangProses) {
            return;
        }

        periksaKeyboard();

        // Periksa ulang untuk menghindari
        // penghentian saat keyboard baru muncul.
        if (keyboardAktif) {
            return;
        }

        // Blur tanpa indikasi keyboard.
        akhiriUjian("Window kehilangan fokus");

    }, TUNDA_BLUR);
});

// =======================================
// FOCUS WINDOW
// =======================================

window.addEventListener("focus", function () {
    if (timerBlur !== null) {
        clearTimeout(timerBlur);
        timerBlur = null;
    }

    periksaKeyboard();
});

// =======================================
// PERUBAHAN ORIENTASI
// =======================================

// Perbarui tinggi awal setelah rotasi layar agar
// perubahan orientasi tidak selalu dianggap keyboard.
window.addEventListener("orientationchange", function () {
    setTimeout(function () {
        tinggiAwal = tinggiSekarang();
        keyboardAktif = false;
    }, 500);
});

</script>

</body>
</html>
