<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Ujian</title>
</head>
<body>

    <h2>Halaman Ujian</h2>
    <p>Jangan meninggalkan halaman ujian.</p>
    <iframe id="exam-frame" src="https://docs.google.com/forms/d/e/1FAIpQLScMgSUSrQkh3Eck1oNI93NkhnjtF6eQrw-VeJZcMcwWcKYH_w/viewform?usp=sharing&ouid=110367447242542532252" frameborder="0" style="width:100%; height:500px;"></iframe>

    <script>
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || navigator.maxTouchPoints > 0;
        let baseHeight = window.innerHeight;

        function endExam() {
            window.location.replace("stop.html");
        }

        // 1. Deteksi visibilitas standar (pindah tab / minimize)
        document.addEventListener("visibilitychange", function () {
            if (document.hidden || document.visibilityState === "hidden") {
                endExam();
            }
        });

        if (isMobile) {
            window.addEventListener("pagehide", endExam);
            window.addEventListener("freeze", endExam);

            // Perbarui baseHeight saat layar normal
            window.addEventListener("resize", function () {
                let currentHeight = window.innerHeight;
                if (currentHeight > baseHeight) {
                    baseHeight = currentHeight;
                }
            });

            // 2. Deteksi Blur Khusus HP
            window.addEventListener("blur", function () {
                // Beri jeda singkat agar sistem mendeteksi ukuran layar secara akurat saat blur terjadi
                setTimeout(function () {
                    let currentHeight = window.innerHeight;
                    let heightDiff = baseHeight - currentHeight;

                    // KONDISI 1: Jika tinggi layar turun drastis (> 120px), 
                    // itu BERARTI KEYBOARD VIRTUAL yang muncul untuk mengetik -> ABAIKAN BLUR
                    if (heightDiff > 120) {
                        return;
                    }

                    // KONDISI 2: Jika fokus berada di dalam iframe (Google Form) DAN tinggi layar stabil (tidak ada keyboard),
                    // tetapi layar menjadi blur/redup (karena tombol tengah ditahan lama) -> AKHIRI UJIAN
                    endExam();
                }, 300);
            });

        } else {
            // === ATURAN LAPTOP / PC ===
            window.addEventListener("blur", function () {
                setTimeout(function () {
                    if (document.activeElement === document.getElementById("exam-frame")) {
                        return;
                    }
                    endExam();
                }, 200);
            });

            window.addEventListener("resize", endExam);
        }
    </script>

</body>
</html>
