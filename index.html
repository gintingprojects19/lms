
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Ujian</title>
</head>
<body>

    <h2>Halaman Ujian</h2>
    <p>Jangan meninggalkan halaman ujian.</p>

    <script>
        

    let halamanDitinggalkan = false;
    let waktuHalamanTersembunyi = 0;
    let sedangDialihkan = false;

    // Sesuaikan dengan halaman penghentian ujian
    const halamanStop = "stop.html";

    // Ambang waktu untuk mengabaikan gangguan yang sangat singkat
    const batasWaktu = 1000;

    // Blur hanya dicatat, bukan langsung menghentikan ujian
    window.addEventListener("blur", function () {
        console.log("Window blur: menunggu pemeriksaan lanjutan");
    });

    window.addEventListener("focus", function () {
        console.log("Window kembali fokus");
    });

    // Deteksi halaman benar-benar tidak terlihat
    document.addEventListener("visibilitychange", function () {

        if (document.visibilityState === "hidden") {
            halamanDitinggalkan = true;
            waktuHalamanTersembunyi = Date.now();
            return;
        }

        if (
            document.visibilityState === "visible" &&
            halamanDitinggalkan &&
            !sedangDialihkan
        ) {
            const durasi =
                Date.now() - waktuHalamanTersembunyi;

            halamanDitinggalkan = false;

            if (durasi >= batasWaktu) {
                sedangDialihkan = true;
                window.location.replace(halamanStop);
            }
        }
    });



    </script>

</body>
</html>
