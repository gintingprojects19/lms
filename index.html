<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Ujian</title>
</head>
<body>

    <h2>Halaman Ujian</h2>
    <p>Jangan meninggalkan halaman ujian.</p>
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLScMgSUSrQkh3Eck1oNI93NkhnjtF6eQrw-VeJZcMcwWcKYH_w/viewform?usp=sharing&ouid=110367447242542532252" frameborder="0" style="width:100%; height:500px;"></iframe>

    <script>
        // Deteksi perangkat (Mobile / HP vs Laptop / PC)
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || navigator.maxTouchPoints > 0;

        // Simpan tinggi normal layar saat pertama kali dibuka (tanpa keyboard)
        const normalHeight = window.innerHeight;

        // 1. Deteksi perpindahan tab (Berlaku untuk Laptop & HP)
        document.addEventListener("visibilitychange", function () {
            if (document.hidden) {
                window.location.replace("stop.html");
            }
        });

        if (!isMobile) {
            // === ATURAN LAPTOP / PC ===
            window.addEventListener("blur", function () {
                window.location.replace("stop.html");
            });
            window.addEventListener("resize", function () {
                window.location.replace("stop.html");
            });
        } else {
            // === ATURAN HP / MOBILE ===
            let blurTimeout = null;

            // Di HP, event resize diabaikan sepenuhnya untuk keamanan deteksi keyboard
            // Karena saat keyboard muncul, window.innerHeight pasti menyusut drastis.

            window.addEventListener("blur", function () {
                // Batalkan timeout sebelumnya jika ada
                if (blurTimeout) clearTimeout(blurTimeout);

                // Menunggu sebentar untuk memastikan apakah blur ini karena keyboard atau pindah aplikasi
                blurTimeout = setTimeout(function () {
                    let currentHeight = window.innerHeight;
                    
                    // KUNCI UTAMA: 
                    // Saat keyboard HP muncul, tinggi layar (`currentHeight`) akan MENYUSUT jauh dibanding `normalHeight`.
                    // Atau, jika elemen yang sedang aktif di dalam halaman adalah elemen input/textarea/iframe, abaikan.
                    let isKeyboardActive = (normalHeight - currentHeight > 100);
                    let activeElement = document.activeElement;
                    let isInsideIframe = (activeElement && activeElement.tagName === 'IFRAME');

                    if (isKeyboardActive || isInsideIframe) {
                        // Ini berarti cuma buka keyboard / mengetik di dalam iframe, JANGAN di-stop!
                        return;
                    }

                    // Jika benar-benar keluar aplikasi / split screen / minimize
                    window.location.replace("stop.html");
                }, 500);
            });

            window.addEventListener("focus", function () {
                // Jika fokus kembali dengan cepat, batalkan hukuman stop.html
                if (blurTimeout) {
                    clearTimeout(blurTimeout);
                    blurTimeout = null;
                }
            });
        }
    </script>

</body>
</html>
