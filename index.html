<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Ujian</title>
</head>
<body>

    <h2>Halaman Ujian</h2>
    <p>Jangan meninggalkan halaman ujian.</p>
    <iframe id="exam-frame" src="https://docs.google.com/forms/d/e/1FAIpQLScMgSUSrQkh3Eck1oNI93NkhnjtF6eQrw-VeJZcMcwWcKYH_w/viewform?usp=sharing&ouid=110367447242542532252" frameborder="0" style="width:100%; height:500px;"></iframe>

    <script>
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || navigator.maxTouchPoints > 0;
        let baseHeight = window.innerHeight;

        function endExam() {
            window.location.replace("stop.html");
        }

        // Kriteria 2: Pindah halaman atau buka tab baru / minimize
        document.addEventListener("visibilitychange", function () {
            if (document.hidden || document.visibilityState === "hidden") {
                endExam();
            }
        });

        if (isMobile) {
            window.addEventListener("pagehide", endExam);
            window.addEventListener("freeze", endExam);

            // Perbarui baseHeight saat ukuran layar normal
            window.addEventListener("resize", function () {
                let currentHeight = window.innerHeight;
                if (currentHeight > baseHeight) {
                    baseHeight = currentHeight;
                }
            });

            // Kriteria 3 & 4 (HP): Pindah halaman/blur mengakhiri ujian, KECUALI saat keyboard virtual digunakan
            window.addEventListener("blur", function () {
                setTimeout(function () {
                    let currentHeight = window.innerHeight;
                    let heightDiff = baseHeight - currentHeight;

                    // Kriteria 3: Jika tinggi layar turun drastis (> 120px), itu adalah KEYBOARD VIRTUAL -> ABAIKAN[cite: 4]
                    if (heightDiff > 120) {
                        return;
                    }

                    // Kriteria 4: Walaupun kursor berada di Google Form (iframe), jika terjadi blur atau tombol tengah ditekan, ujian tetap berakhir
                    endExam();
                }, 300);
            });

        } else {
            // === ATURAN LAPTOP / PC ===
            // Kriteria 1: Resize langsung mengakhiri ujian
            window.addEventListener("resize", endExam);

            // Kriteria 2: Blur / pindah halaman langsung mengakhiri ujian
            window.addEventListener("blur", endExam);
        }
    </script>

</body>
</html>
