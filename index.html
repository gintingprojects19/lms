<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Ujian</title>
</head>
<body>

    <h2>Halaman Ujian</h2>
    <p>Jangan meninggalkan halaman ujian.</p>
    <iframe id="exam-frame" src="https://docs.google.com/forms/d/e/1FAIpQLScMgSUSrQkh3Eck1oNI93NkhnjtF6eQrw-VeJZcMcwWcKYH_w/viewform?usp=sharing&ouid=110367447242542532252" frameborder="0" style="width:100%; height:500px;"></iframe>

    <script>
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || navigator.maxTouchPoints > 0;
        let baseHeight = window.innerHeight;

        function endExam() {
            window.location.replace("stop.html");
        }

        // 1. Pindah halaman atau buka tab baru / minimize
        document.addEventListener("visibilitychange", function () {
            if (document.hidden || document.visibilityState === "hidden") {
                endExam();
            }
        });

        if (isMobile) {
            window.addEventListener("pagehide", endExam);
            window.addEventListener("freeze", endExam);

            // Pantau perubahan ukuran layar
            window.addEventListener("resize", function () {
                let currentHeight = window.innerHeight;
                if (currentHeight > baseHeight) {
                    baseHeight = currentHeight;
                }
            });

            // 2. Deteksi Blur pada HP dengan proteksi ketat untuk Keyboard
            window.addEventListener("blur", function () {
                // Cek apakah fokus saat blur terjadi berada di dalam iframe (Google Form)
                // Saat mengetik di HP, fokus sering berada di dalam iframe/form
                let activeEl = document.activeElement;
                let isInsideFrame = (activeEl && activeEl.tagName === "IFRAME");

                setTimeout(function () {
                    let currentHeight = window.innerHeight;
                    let heightDiff = baseHeight - currentHeight;

                    // KUNCI UTAMA: Jika tinggi layar turun drastis (> 120px) ATAU fokus ada di dalam iframe saat blur,
                    // itu BERARTI KARENA KEYBOARD VIRTUAL ATAU MENGETIK -> JANGAN AKHIRI UJIAN
                    if (heightDiff > 120 || isInsideFrame) {
                        return;
                    }

                    // Jika tidak ada penurunan tinggi layar dan bukan karena mengetik di form (artinya tombol tengah / pindah aplikasi), akhiri ujian
                    endExam();
                }, 350);
            });

        } else {
            // === ATURAN LAPTOP / PC ===
            // 1. Resize langsung mengakhiri ujian
            window.addEventListener("resize", endExam);

            // 2. Pindah halaman / blur pada Laptop
            window.addEventListener("blur", function () {
                setTimeout(function () {
                    if (document.activeElement === document.getElementById("exam-frame")) {
                        return;
                    }
                    endExam();
                }, 200);
            });
        }
    </script>

</body>
</html>
