
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Halaman Ujian</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 16px;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        h2 {
            margin-top: 0;
            color: #1f2937;
        }

        p {
            color: #444;
        }

        .form-container {
            width: 100%;
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }

        iframe {
            display: block;
            width: 100%;
            height: 75vh;
            min-height: 450px;
            border: 0;
        }

        @media (max-width: 600px) {
            body {
                padding: 8px;
            }

            iframe {
                height: 75vh;
                min-height: 400px;
            }
        }
    </style>
</head>

<body>

    <h2>Halaman Ujian</h2>

    <p>
        Silakan kerjakan soal dengan teliti.
        Jangan meninggalkan halaman ujian.
    </p>

    <div class="form-container">

        <iframe
            id="iframeUjian"
            title="Formulir Ujian"
            src="https://docs.google.com/forms/d/e/1FAIpQLScMgSUSrQkh3Eck1oNI93NkhnjtF6eQrw-VeJZcMcwWcKYH_w/viewform?usp=sharing&ouid=110367447242542532252"
            allow="clipboard-write">
        </iframe>

    </div>

<script>
"use strict";

// ========================================
// 1. PENGATURAN
// ========================================

const BATAS_KEYBOARD = 120;
const TOLERANSI_RESIZE = 1500;
const TOLERANSI_IFRAME = 3000;
const WAKTU_PEMERIKSAAN = 1000;

const iframeUjian = document.getElementById("iframeUjian");

let sedangProses = false;
let keyboardAktif = false;
let waktuResize = 0;
let waktuInteraksiIframe = 0;
let timerPemeriksaan = null;

let tinggiAwal = window.visualViewport
    ? window.visualViewport.height
    : window.innerHeight;

// ========================================
// 2. DETEKSI KEYBOARD VIRTUAL
// ========================================

function perbaruiStatusKeyboard() {

    if (!window.visualViewport) {
        keyboardAktif = false;
        return;
    }

    const tinggiSekarang = window.visualViewport.height;

    keyboardAktif =
        (tinggiAwal - tinggiSekarang) > BATAS_KEYBOARD;
}

if (window.visualViewport) {

    window.visualViewport.addEventListener("resize", function () {

        waktuResize = Date.now();

        perbaruiStatusKeyboard();

    });

}

// ========================================
// 3. DETEKSI PERUBAHAN UKURAN JENDELA
// ========================================

window.addEventListener("resize", function () {

    waktuResize = Date.now();

    perbaruiStatusKeyboard();

});

// ========================================
// 4. CATAT INTERAKSI PADA IFRAME
// ========================================

// Browser tidak selalu meneruskan event dari dokumen
// Google Forms ke halaman utama karena iframe berbeda domain.

if (iframeUjian) {

    iframeUjian.addEventListener("pointerdown", function () {

        waktuInteraksiIframe = Date.now();

    });

    iframeUjian.addEventListener("touchstart", function () {

        waktuInteraksiIframe = Date.now();

    }, { passive: true });

}

// ========================================
// 5. PEMERIKSAAN BLUR
// ========================================

window.addEventListener("blur", function () {

    if (sedangProses) {
        return;
    }

    // Abaikan ketika keyboard virtual terdeteksi.
    perbaruiStatusKeyboard();

    if (keyboardAktif) {
        return;
    }

    // Abaikan blur yang berdekatan dengan resize.
    if (Date.now() - waktuResize < TOLERANSI_RESIZE) {
        return;
    }

    // Abaikan blur sesaat setelah interaksi iframe.
    if (Date.now() - waktuInteraksiIframe < TOLERANSI_IFRAME) {
        return;
    }

    // Hindari timer pemeriksaan yang berulang.
    if (timerPemeriksaan !== null) {
        clearTimeout(timerPemeriksaan);
    }

    timerPemeriksaan = setTimeout(function () {

        timerPemeriksaan = null;

        if (sedangProses) {
            return;
        }

        // Halaman sudah kembali fokus.
        if (document.hasFocus()) {
            return;
        }

        // Periksa ulang keyboard.
        perbaruiStatusKeyboard();

        if (keyboardAktif) {
            return;
        }

        // Periksa ulang resize.
        if (Date.now() - waktuResize < TOLERANSI_RESIZE) {
            return;
        }

        // Periksa ulang interaksi iframe.
        if (Date.now() - waktuInteraksiIframe < TOLERANSI_IFRAME) {
            return;
        }

        // ====================================
        // 6. AKHIRI UJIAN
        // ====================================

        sedangProses = true;

        window.location.replace("stop.html");

    }, WAKTU_PEMERIKSAAN);

});

// ========================================
// 7. KETIKA HALAMAN KEMBALI FOKUS
// ========================================

window.addEventListener("focus", function () {

    if (timerPemeriksaan !== null) {
        clearTimeout(timerPemeriksaan);
        timerPemeriksaan = null;
    }

    perbaruiStatusKeyboard();

});

// ========================================
// 8. KETIKA HALAMAN DIBUKA KEMBALI
// ========================================

document.addEventListener("visibilitychange", function () {

    if (document.visibilityState === "visible") {

        perbaruiStatusKeyboard();

    }

});

</script>

</body>
</html>
