<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Ujian</title>
</head>
<body>

    <h2>Halaman Ujian</h2>
    <p>Jangan meninggalkan halaman ujian.</p>
    <iframe id="exam-frame" src="https://docs.google.com/forms/d/e/1FAIpQLScMgSUSrQkh3Eck1oNI93NkhnjtF6eQrw-VeJZcMcwWcKYH_w/viewform?usp=sharing&ouid=110367447242542532252" frameborder="0" style="width:100%; height:500px;"></iframe>

    <script>
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || navigator.maxTouchPoints > 0;
        let baseHeight = window.innerHeight;
        let isKeyboardActive = false;

        function endExam() {
            window.location.replace("stop.html");
        }

        // 1. Deteksi utama visibilitas standar (pindah tab / minimize aplikasi)
        document.addEventListener("visibilitychange", function () {
            if (document.hidden || document.visibilityState === "hidden") {
                endExam();
            }
        });

        if (isMobile) {
            window.addEventListener("pagehide", endExam);
            window.addEventListener("freeze", endExam);

            // 2. Deteksi ukuran layar untuk mengenali Keyboard HP saat mengetik
            window.addEventListener("resize", function () {
                let currentHeight = window.innerHeight;
                let heightDiff = baseHeight - currentHeight;

                // Jika tinggi layar turun drastis (> 120px), berarti KEYBOARD HP sedang aktif
                if (heightDiff > 120) {
                    isKeyboardActive = true;
                } else {
                    isKeyboardActive = false;
                    // Perbarui baseHeight jika tinggi kembali normal/stabil
                    if (currentHeight > baseHeight) {
                        baseHeight = currentHeight;
                    }
                }
            });

            // 3. Deteksi Blur Khusus HP
            window.addEventListener("blur", function () {
                // TAMBAHAN UTAMA: Jika keyboard HP sedang aktif (seperti saat mengetik di form), 
                // atau fokus berada di dalam iframe (Google Form), abaikan blur sepenuhnya!
                if (isKeyboardActive || document.activeElement === document.getElementById("exam-frame")) {
                    return;
                }

                // Beri jeda singkat untuk memastikan status
                setTimeout(function () {
                    // Cek ulang kondisi keyboard saat timeout
                    if (isKeyboardActive || document.activeElement === document.getElementById("exam-frame")) {
                        return;
                    }

                    let currentHeight = window.innerHeight;
                    let heightDiff = baseHeight - currentHeight;

                    // Jika tinggi layar tidak turun drastis (<= 120px) tapi terjadi blur, 
                    // itu artinya pengguna menahan tombol tengah (bukan keyboard), maka UJIAN BERAKHIR
                    if (heightDiff <= 120) {
                        endExam();
                    }
                }, 250);
            });

            window.addEventListener("focus", function () {
                setTimeout(() => {
                    if (window.innerHeight > baseHeight) {
                        baseHeight = window.innerHeight;
                    }
                    isKeyboardActive = false;
                }, 300);
            });

        } else {
            // === ATURAN LAPTOP / PC ===
            window.addEventListener("blur", function () {
                setTimeout(function () {
                    if (document.activeElement === document.getElementById("exam-frame")) {
                        return;
                    }
                    endExam();
                }, 200);
            });

            window.addEventListener("resize", endExam);
        }
    </script>

</body>
</html>
