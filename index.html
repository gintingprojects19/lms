
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ujian Dihentikan</title>

    <style>
        body {
            margin: 0;
            padding: 25px;
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f8fafc;
        }

        .pesan {
            max-width: 500px;
            margin: 60px auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 10px #00000015;
        }

        h2 {
            color: #b91c1c;
        }

        p {
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <div class="pesan">
        <h2>Ujian Dihentikan</h2>

        <p>
            Sesi ujian Anda telah dihentikan.
        </p>

        <p>
            Silakan hubungi guru atau pengawas
            untuk mendapatkan petunjuk selanjutnya.
        </p>
    </div>

</body>
</html>
