<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Ujian</title>
</head>
<body>

    <h2>Halaman Ujian</h2>
    <p>Jangan meninggalkan halaman ujian.</p>
    <!-- Tambahkan id="exam-frame" agar bisa dideteksi oleh skrip -->
    <iframe id="exam-frame" src="https://docs.google.com/forms/d/e/1FAIpQLScMgSUSrQkh3Eck1oNI93NkhnjtF6eQrw-VeJZcMcwWcKYH_w/viewform?usp=sharing&ouid=110367447242542532252" frameborder="0" style="width:100%; height:500px;"></iframe>

    <script>
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || navigator.maxTouchPoints > 0;
        let baseHeight = window.innerHeight;

        // 1. Deteksi perpindahan tab atau minimize aplikasi (Paling akurat)
        document.addEventListener("visibilitychange", function () {
            if (document.hidden || document.visibilityState === "hidden") {
                window.location.replace("stop.html");
            }
        });

        if (!isMobile) {
            // === ATURAN LAPTOP / PC ===
            window.addEventListener("blur", function () {
                // Beri sedikit jeda untuk mengecek apakah fokus berpindah ke dalam iframe (mengisi soal)
                setTimeout(function () {
                    // Jika elemen yang sedang aktif di halaman adalah iframe, berarti siswa sedang mengetik/mengisi form
                    if (document.activeElement === document.getElementById("exam-frame")) {
                        return; // Abaikan, jangan akhiri ujian
                    }
                    window.location.replace("stop.html");
                }, 200);
            });

            window.addEventListener("resize", function () {
                window.location.replace("stop.html");
            });
        } else {
            // === ATURAN HP / MOBILE ===
            window.addEventListener("resize", function () {
                if (window.innerHeight > baseHeight) {
                    baseHeight = window.innerHeight;
                }
            });

            let blurTimeout = null;

            window.addEventListener("blur", function () {
                // Cek apakah fokus lari ke iframe (mengisi Google Form)
                if (document.activeElement === document.getElementById("exam-frame")) {
                    return; 
                }

                blurTimeout = setTimeout(function () {
                    let currentHeight = window.innerHeight;
                    let heightDiff = baseHeight - currentHeight;

                    // Jika tinggi viewport turun > 120px, artinya keyboard virtual HP yang muncul, abaikan.
                    if (heightDiff > 120) {
                        return; 
                    }

                    // Jika benar-benar keluar aplikasi / menekan tombol Home / Recent Apps
                    window.location.replace("stop.html");
                }, 300);
            });

            window.addEventListener("focus", function () {
                if (blurTimeout) {
                    clearTimeout(blurTimeout);
                    blurTimeout = null;
                }
            });
        }
    </script>

</body>
</html>
